services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.40@sha256:0a0ed62b20fa48ad9a5321cef1fbe98a6c02237827b04ee30ecceb8fb39b36e0
    container_name: cli-proxy-api
    user: "${CLIPROXY_UID:-1000}:${CLIPROXY_GID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLIPROXYAPI_PORT:-8318}:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:${CLIPROXYAPI_AG_PORT:-51122}:51121"
    volumes:
      - ./private/cli-proxy/config.yaml:/CLIProxyAPI/config.yaml
      - ./cli-proxy/auths:/auths
      - ./private/cli-proxy/static:/CLIProxyAPI/static
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8317' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cli_proxy_net

networks:
  cli_proxy_net:
    name: pbl6_cli_proxy_net
