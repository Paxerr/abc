name: Demo Data

on:
  push:
    branches: [main]
    paths:
      - 'dataBase_demo/**'
      - 'backend/src/main/resources/db/migration/**'
      - '.github/workflows/demo-data.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dataBase_demo/**'
      - 'backend/src/main/resources/db/migration/**'
      - '.github/workflows/demo-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-demo:
    name: Load and verify demo fixtures (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: danasea_demo_ci
          POSTGRES_USER: postgres
          # Disposable CI database, accessible only within the runner's Docker network.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres -d danasea_demo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/demo-venv"
          "$RUNNER_TEMP/demo-venv/bin/python" -m pip install -r dataBase_demo/installer/requirements.txt

      - name: Validate package and fixture contracts
        run: |
          "$RUNNER_TEMP/demo-venv/bin/python" -B dataBase_demo/installer/install_demo_data.py --validate-only
          "$RUNNER_TEMP/demo-venv/bin/python" -B -m unittest discover -s dataBase_demo/tests -p test_package.py -v

      - name: Migrate the isolated demo database to V37
        # The fixture installer accepts V24/V37. V38 seeds a different set of accounts.
        env:
          DEMO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker run --rm --network "container:$DEMO_POSTGRES_CONTAINER" \
            -v "$GITHUB_WORKSPACE/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            redgate/flyway:13.10.0 \
            -url=jdbc:postgresql://127.0.0.1:5432/danasea_demo_ci \
            -user=postgres -target=37 -cleanDisabled=true -baselineOnMigrate=false migrate

      - name: Back up the demo database before loading
        env:
          DEMO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p dataBase_demo/runtime
          docker exec "$DEMO_POSTGRES_CONTAINER" pg_dump \
            -U postgres -d danasea_demo_ci -Fc > "$RUNNER_TEMP/demo-before.dump"

      - name: Dry-run, load and verify a second load is idempotent
        shell: bash
        env:
          DEMO_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          DEMO_PASSWORD="$("$RUNNER_TEMP/demo-venv/bin/python" -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$DEMO_PASSWORD"
          installer=("$RUNNER_TEMP/demo-venv/bin/python" -B dataBase_demo/installer/install_demo_data.py
            --development --database danasea_demo_ci --docker-container "$DEMO_POSTGRES_CONTAINER"
            --reuse-storage --password-stdin --backup "$RUNNER_TEMP/demo-before.dump")
          printf '%s\n' "$DEMO_PASSWORD" | "${installer[@]}" --dry-run
          cp dataBase_demo/runtime/install_result.json dataBase_demo/runtime/dry-run.json
          # Check the rollback using a separate database connection.
          users="$(docker exec "$DEMO_POSTGRES_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 \
            -U postgres -d danasea_demo_ci -c 'SELECT count(*) FROM public.users')"
          test "$users" = 0
          printf '%s\n' "$DEMO_PASSWORD" | "${installer[@]}" --apply
          cp dataBase_demo/runtime/install_result.json dataBase_demo/runtime/first-load.json
          printf '%s\n' "$DEMO_PASSWORD" | "${installer[@]}" --apply
          cp dataBase_demo/runtime/install_result.json dataBase_demo/runtime/second-load.json

      - name: Verify results and publish a summary
        run: |
          "$RUNNER_TEMP/demo-venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('dataBase_demo/runtime')
          dry, first, second = [json.loads((root / name).read_text()) for name in
                                ('dry-run.json', 'first-load.json', 'second-load.json')]
          assert dry['status'] == 'DRY_RUN_ROLLBACK_PASS'
          assert first['status'] == second['status'] == 'COMMIT_SELECT_PASS'
          # Migrations already provide five of the fixture's base categories.
          assert all(t['inserted'] + t['existing'] == t['equal'] == t['expected']
                     for t in first['tables'].values())
          assert all(t['inserted'] == 0 and t['existing'] == t['equal'] == t['expected']
                     for t in second['tables'].values())
          total = sum(t['equal'] for t in second['tables'].values())
          inserted = sum(t['inserted'] for t in first['tables'].values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Demo data: dry-run rollback verified, {total} fixture rows verified '
                            f'across {len(second["tables"])} tables ({inserted} new rows); '
                            'second load inserted 0 rows.\n\n'
                            f'Media SHA256 checks: {second["storageVerified"]}. '
                            'Database: disposable danasea_demo_ci, Flyway V37.\n\n'
                            'The database is removed with the runner. No application/API smoke test was run.\n')
          PY

      - name: Remove temporary secrets and backup
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/demo-before.dump"
          rm -rf dataBase_demo/runtime
