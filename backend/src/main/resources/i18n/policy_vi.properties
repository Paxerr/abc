policy.general=Chính sách chung DANASEA: bảo vệ quyền lợi khách hàng, an toàn hàng hải và minh bạch dịch vụ du lịch biển Đà Nẵng.
policy.refund=Chính sách hoàn tiền: hoàn 100% khi hủy trước giờ khởi hành trên 24 giờ; không hoàn trong vòng 24 giờ hoặc khi không đến. Thời tiết nguy hiểm, lỗi vendor và lỗi hệ thống đã xác minh được hoàn toàn bộ.
policy.cancellation=Chính sách hoàn tiền: hoàn 100% khi hủy trước giờ khởi hành trên 24 giờ; không hoàn trong vòng 24 giờ hoặc khi không đến. Thời tiết nguy hiểm, lỗi vendor và lỗi hệ thống đã xác minh được hoàn toàn bộ.
policy.weather_cancellation=Chính sách hủy do thời tiết: khi điều kiện hàng hải hoặc thiên tai không an toàn, chuyến đi được hoàn tiền 100% hoặc đổi ngày miễn phí.
policy.safety=Chính sách an toàn: khách hàng bắt buộc mặc áo phao và tuân theo mọi hướng dẫn an toàn hàng hải.
policy.refund.weather=Hoàn 100% do điều kiện thời tiết hàng hải nguy hiểm.
policy.refund.vendor_fault=Hoàn 100% do sự cố từ nhà cung cấp dịch vụ.
policy.refund.admin_override=Hoàn tiền theo quyết định của quản trị viên.
policy.refund.100=Hoàn 100% số tiền thực trả theo chính sách hủy đã lưu của đơn.
policy.refund.70=Hoàn 70% tiền cọc khi hủy trước giờ khởi hành từ 24 đến 48 giờ.
policy.refund.30=Hoàn 30% tiền cọc khi hủy trước giờ khởi hành từ 2 đến 24 giờ.
policy.refund.0=Không hoàn khi hủy trong vòng 24 giờ trước khởi hành, sau khởi hành hoặc không đến.
policy.cancellation.mixed=Áp dụng chính sách hủy tiêu chuẩn; từng hạng mục có mức hoàn tiền khác nhau.
policy.refund.system_fault=Hoàn 100% do lỗi hệ thống đã xác minh.
